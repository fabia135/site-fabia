<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Fábia Oliveira - Imóveis à Venda</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    header {
      background-color: #005f73;
      color: white;
      padding: 20px;
      text-align: center;
    }
    .intro {
      padding: 20px;
      text-align: center;
      background-color: #e0fbfc;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px;
    }
    .card {
      background-color: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      overflow: hidden;
      text-align: center;
    }
    .card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .card h3 {
      margin: 15px 0;
      color: #333;
    }
    .card a {
      display: inline-block;
      margin-bottom: 15px;
      padding: 10px 20px;
      background-color: #005f73;
      color: white;
      border-radius: 4px;
      text-decoration: none;
    }
    .card a:hover {
      background-color: #0a9396;
    }
    footer {
      text-align: center;
      padding: 20px;
      background-color: #ccc;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fábia Oliveira</h1>
    <p>Divulgação de imóveis com atendimento acolhedor e transparente</p>
  </header>

  <section class="intro">
